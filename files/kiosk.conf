# /etc/dbskiosk/kiosk.conf
# Zentrale Konfigurationsdatei für dbsKioskPi
# Bearbeitbar manuell oder über das CLI-Tool: sudo dbs-config

# Ziel-URL des Kiosk-Browsers
KIOSK_URL="https://dbs.edupage.org/infoscreen/7?scaletowidth=1920"

# HDMI-CEC TV-Steuerung aktivieren (true/false)
CEC_ENABLED="true"

# Tägliche Einschaltzeit für den Fernseher (Format: HH:MM im 24h-Format)
CEC_ON_TIME="07:00"

# Tägliche Standby-Zeit für den Fernseher (Format: HH:MM im 24h-Format)
CEC_OFF_TIME="19:00"

# Zusätzliche Chromium-Parameter (optional, standardmäßig leer)
EXTRA_CHROMIUM_FLAGS=""
